# Pool Marx — systemd-Ergänzung für pool_marx.service
#
# Installieren auf dem Pi:
#   sudo install -D -m 644 pool_marx.override.conf \
#     /etc/systemd/system/pool_marx.service.d/override.conf
#   sudo systemctl daemon-reload && sudo systemctl restart pool_marx
# (oder Inhalt per `sudo systemctl edit pool_marx` einfügen)

[Service]
# Secrets als Umgebungsvariablen (Datei nur für root lesbar)
EnvironmentFile=/etc/pool_marx/secrets.env
# Telemetrie-Zugangsdaten (OTEL_EXPORTER_OTLP_*), optional: "-" = Datei darf fehlen
EnvironmentFile=-/etc/pool_marx/telemetry.env

# Neustart, wenn sich der Dienst 60s nicht meldet (siehe main.py systemd_watchdog)
WatchdogSec=60
